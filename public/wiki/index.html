<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orion Code Wiki</title>
<style>
:root{--bg:#fff;--fg:#1b1f23;--mut:#5b6570;--bd:#d6dbe0;--ac:#0a6b3a;--card:#f4f6f8;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0f1512;--fg:#e4ebe6;--mut:#9aa8a0;--bd:#2a3730;--ac:#50fa7b;--card:#16201a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
header,main{max-width:920px;margin:auto;padding:10px 14px}
h1{font-size:18px;margin:0}small,.mut{color:var(--mut)}
a{color:var(--ac)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
button,input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:5px 10px}
button.on{border-color:var(--ac);color:var(--ac)}
input{width:100%;box-sizing:border-box}
details,table{background:var(--card);border:1px solid var(--bd);border-radius:6px;margin:6px 0}
details>summary{padding:6px 10px;cursor:pointer;word-break:break-all}
details>div{padding:2px 12px 8px}
table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--bd);padding:3px 7px;text-align:left;vertical-align:top}
.scroll{overflow-x:auto}pre{overflow-x:auto;background:var(--card);padding:8px;border-radius:6px}
code{font-family:ui-monospace,monospace;font-size:13px}
.warn{color:#c0392b}
</style>
</head>
<body>
<header>
  <h1>Orion Code Wiki</h1>
  <small id="stamp">loading&hellip;</small>
  <nav id="tabs"></nav>
  <input id="q" type="search" placeholder="Search anchors, files, exports, docs&hellip;" autocomplete="off">
</header>
<main id="view"></main>
<script>
'use strict';
/** Builds a DOM element; all text goes through textContent / text nodes (no innerHTML). */
const h = (tag, props = {}, ...kids) => { const e = document.createElement(tag); Object.assign(e, props); e.append(...kids); return e; };
let D = null, tab = 'anchors', doc = null, q = '';
const TABS = ['anchors', 'files', 'docs', 'health'];
const src = (p, l) => D.meta.repo ? `https://github.com/${D.meta.repo}/blob/${D.meta.sha}/${p}${l ? '#L' + l : ''}` : null;
const link = (text, p, l) => { const u = src(p, l); return u ? h('a', { href: u, textContent: text, target: '_blank', rel: 'noopener' }) : document.createTextNode(text); };
const has = (...s) => !q || s.some((x) => String(x).toLowerCase().includes(q));

/** Minimal Markdown renderer: headings, code fences, tables, lists, inline code. Escapes by construction. */
function md(text) {
  const out = document.createDocumentFragment();
  let fence = null, rows = null;
  const inline = (s) => { const p = h('span'); s.split('`').forEach((t, i) => p.append(i % 2 ? h('code', { textContent: t }) : document.createTextNode(t))); return p; };
  const flush = () => { if (rows) { const t = h('table'); rows.forEach((r, i) => t.append(h('tr', {}, ...r.map((c) => h(i ? 'td' : 'th', {}, inline(c)))))); out.append(h('div', { className: 'scroll' }, t)); rows = null; } };
  for (const line of text.split('\n')) {
    if (line.startsWith('```')) { if (fence) { out.append(fence); fence = null; } else { flush(); fence = h('pre'); } continue; }
    if (fence) { fence.textContent += line + '\n'; continue; }
    if (line.startsWith('|')) { const c = line.split('|').slice(1, -1).map((s) => s.trim()); if (!c.every((s) => /^:?-+:?$/.test(s))) (rows ||= []).push(c); continue; }
    flush();
    const m = /^(#{1,4})\s+(.*)/.exec(line);
    if (m) out.append(h('h' + (m[1].length + 1), {}, inline(m[2])));
    else if (/^\s*[-*]\s+/.test(line)) out.append(h('div', {}, '\u2022 ', inline(line.replace(/^\s*[-*]\s+/, ''))));
    else if (line.trim()) out.append(h('p', {}, inline(line)));
  }
  flush();
  return out;
}

const VIEWS = {
  anchors: () => D.anchors.filter((a) => has(a.id, a.path)).map((a) => h('div', {}, h('b', { textContent: a.id }), ' ', link(`${a.path}:${a.line}`, a.path, a.line))),
  files: () => D.files.filter((f) => has(f.path, ...f.exports.map((e) => e.name))).map((f) => h('details', {},
    h('summary', {}, `${f.path} `, h('small', { className: 'mut', textContent: `${f.lines} lines \u00b7 ${f.exports.length} exports` })),
    h('div', {}, link('view source', f.path), ...f.exports.map((e) => h('div', {}, h('code', { textContent: `${e.kind} ${e.name}` }), ' ', link(`L${e.line}`, f.path, e.line), ' ', h('small', { className: 'mut', textContent: e.doc.split(/(?<=\.)\s/)[0].slice(0, 160) })))))),
  docs: () => doc ? [h('button', { textContent: '\u2190 docs', onclick: () => { doc = null; show(); } }), md(doc.text)]
    : D.docs.filter((d) => has(d.title, d.path, d.text)).map((d) => h('div', {}, h('a', { href: '#', textContent: d.title, onclick: (e) => { e.preventDefault(); doc = d; show(); } }), ' ', h('small', { className: 'mut', textContent: d.path }))),
  health: () => {
    const t = h('table'); for (const [k, v] of Object.entries(D.stats)) t.append(h('tr', {}, h('td', { textContent: k }), h('td', { textContent: v })));
    const d = D.drift, bad = d.inCodeNotDocs.length + d.inDocsNotCode.length;
    return [h('div', { className: 'scroll' }, t), h('p', { className: bad ? 'warn' : '' }, bad ? `Anchor drift \u2014 code only: ${d.inCodeNotDocs.join(', ') || 'none'}; docs only: ${d.inDocsNotCode.join(', ') || 'none'}` : 'No anchor drift.')];
  },
};

/** Re-renders the tab bar and the active view. */
function show() {
  const tabs = document.getElementById('tabs'); tabs.replaceChildren(...TABS.map((t) => h('button', { textContent: t, className: t === tab ? 'on' : '', onclick: () => { tab = t; doc = null; show(); } })));
  const kids = VIEWS[tab]();
  document.getElementById('view').replaceChildren(...(kids.length === 0 ? [h('p', { className: 'mut', textContent: 'No matches.' })] : [].concat(kids)));
}

document.getElementById('q').addEventListener('input', (e) => { q = e.target.value.trim().toLowerCase(); doc = null; show(); });
fetch('./index.json').then((r) => r.json()).then((j) => {
  D = j;
  const sha7 = D.meta.sha.slice(0, 7);
  const commit = D.meta.repo ? h('a', { href: `https://github.com/${D.meta.repo}/commit/${D.meta.sha}`, textContent: sha7, target: '_blank', rel: 'noopener' }) : sha7;
  document.getElementById('stamp').replaceChildren('Mirrors commit ', commit, ` \u00b7 ${D.meta.date.slice(0, 10)} \u00b7 ${D.meta.repo || 'local build'}`);
  show();
}).catch(() => { document.getElementById('stamp').textContent = 'Could not load index.json'; });
</script>
</body>
</html>
